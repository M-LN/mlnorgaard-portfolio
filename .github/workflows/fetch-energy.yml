name: Fetch live energy data

on:
  schedule:
    - cron: '*/5 * * * *'   # hvert 5. minut (UTC)
  workflow_dispatch:         # kan også køres manuelt

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch PowerSystemRightNow
        run: |
          tmp_file="$(mktemp)"
          if curl -s \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://api.energidataservice.dk/dataset/PowerSystemRightNow?start=now-PT3H&sort=Minutes1UTC%20DESC&limit=200" \
            -o "$tmp_file" \
            && python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$tmp_file"; then
            mv "$tmp_file" data/psrn.json
          else
            echo "Fetch/validate failed for psrn.json – keeping previous file"
            rm -f "$tmp_file"
          fi

      - name: Fetch DayAheadPrices
        # 15-min opløsning: start 3 timer tilbage så "nu"-prisen altid findes;
        # limit 400 dækker ca. -3h til +36h for begge prisområder
        run: |
          tmp_file="$(mktemp)"
          if curl -s \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://api.energidataservice.dk/dataset/DayAheadPrices?start=now-PT3H&filter=%7B%22PriceArea%22%3A%5B%22DK1%22%2C%22DK2%22%5D%7D&sort=TimeUTC%20DESC&limit=400" \
            -o "$tmp_file" \
            && python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$tmp_file"; then
            mv "$tmp_file" data/prices.json
          else
            echo "Fetch/validate failed for prices.json – keeping previous file"
            rm -f "$tmp_file"
          fi

      - name: Commit hvis data er ændret
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: live energy data $(date -u +%H:%M)"
          git push
